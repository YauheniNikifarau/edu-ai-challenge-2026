[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atc-mcp"
version = "0.1.0"
description = "ATC MCP server for air-traffic control scheduling assistance"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
